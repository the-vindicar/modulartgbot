volumes:
  postgre-data:
  multibot-data:

services:
  postgresql:
    hostname: postgresql
    container_name: postgresql
    # ports:
    #  - "55432:5432"  # это только для отладки
    image: postgres:17
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=multibot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "multibot"]
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 5
    volumes:
      - postgre-data:/var/lib/postgresql/data  # valid for postgres:17, but not 18+!

  multibot:
    hostname: multibot
    container_name: multibot
    ports:
      - "8080:8080"
    build: .
    env_file:
      - .env
    environment:
      - MULTIBOT_DATA=/data/multibot
      - POSTGRES_HOST=postgresql
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=multibot
      # - MOODLE_USER=username
      #  MOODLE_PWD=password
      #  TELEGRAM_PROXY=socks5h://host.docker.internal:2080
      #  TELEGRAM_BOT_TOKEN=token
      - TELEGRAM_FSM_TEMP_STORAGE=1
      - QUART_ROOT=/
      #- QUART_AUTH_SECRET=secret value chosen by you
    volumes:
      - multibot-data:/data/multibot
    tty: true
    init: true
    depends_on:
      postgresql:
        condition: service_healthy
